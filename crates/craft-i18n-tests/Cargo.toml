[package]
name = "craft-i18n-tests"
description = "Checks on the translation catalogs themselves: rows are well formed, placeholders and plural forms match the English source text, locale and file names follow the layout."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
icu_locale_core = "=2.3.0"
icu_plurals = "=2.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
spdx = "0.13.6"
tar = "0.4.46"
toml = "1.1.8"
unic-langid = "0.9"
ureq = "3.5.0"
zstd = "0.14.3"

[lints]
workspace = true

[dev-dependencies]
# craft-libs main at the merge of #497 (flag-based compounding), which also has #496.
craft-proof = { git = "https://github.com/storytold/craft-libs", rev = "47c9f625" }
# The runtime crate, at craft-libs main after #210 (icu_plurals 2.3.0, CLDR 48.2.1), so
# tests/runtime_agreement.rs can check the two count plural forms the same way.
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "32b2fd8a" }
